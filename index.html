<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BunnyVid</title>
<meta name="description" content="BunnyVid, kumpulan video pendek.">
<meta name="theme-color" content="#d63a63">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cg fill='%23d63a63'%3E%3Cellipse cx='11' cy='8' rx='3.2' ry='7'/%3E%3Cellipse cx='21' cy='8' rx='3.2' ry='7'/%3E%3Crect x='3' y='11' width='26' height='19' rx='9'/%3E%3C/g%3E%3Cpath d='M13.5 15.5v10l8-5z' fill='%23fff'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#f6f6f4;--fg:#1a1a1a;--muted:#6b6b6b;--card:#e4e4e0;--line:rgba(0,0,0,.08);
    --accent:#1a1a1a;--accent-fg:#fff;
    --brand:#d63a63;--brand-fg:#fff;
    --head:rgba(246,246,244,.88);
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#101010;--fg:#f2f2f2;--muted:#9a9a9a;--card:#1d1d1d;--line:rgba(255,255,255,.1);
      --accent:#f2f2f2;--accent-fg:#101010;
      --brand:#ff7a9c;--brand-fg:#101010;
      --head:rgba(16,16,16,.88);
    }
  }
  *{box-sizing:border-box;margin:0}
  html{scroll-padding-top:64px}
  body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}

  /* header */
  .top{position:sticky;top:0;z-index:10;background:var(--head);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .top .in{max-width:640px;margin:0 auto;padding:0 12px;height:56px;display:flex;align-items:center;justify-content:space-between}
  .brand{display:flex;align-items:center;gap:8px;color:var(--fg);text-decoration:none;font-size:22px;font-weight:800;letter-spacing:-.03em}
  .logo{width:28px;height:28px;color:var(--brand);flex:none}
  .count{font-size:13px;color:var(--muted)}

  main{max-width:640px;margin:0 auto;padding:12px 8px 40px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}

  /* kartu video */
  .item{position:relative;aspect-ratio:9/16;background:var(--card);border-radius:8px;overflow:hidden}
  .item video{width:100%;height:100%;object-fit:cover;display:block}
  .item video:fullscreen{object-fit:contain;background:#000}
  .item video:-webkit-full-screen{object-fit:contain;background:#000}
  .hit{position:absolute;inset:0;z-index:1;width:100%;height:100%;border:0;background:transparent;cursor:pointer;border-radius:inherit}
  .item .t{position:absolute;left:0;right:0;bottom:0;padding:24px 8px 10px;color:#fff;font-size:13px;line-height:1.3;background:linear-gradient(transparent,rgba(0,0,0,.65));pointer-events:none;transition:opacity .2s}
  .item .t:empty{display:none}
  .item.playing .t{opacity:0}
  .item .p{position:absolute;inset:0;margin:auto;width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.5);pointer-events:none;transition:opacity .2s}
  .item .p::after{content:"";position:absolute;left:17px;top:12px;border-left:16px solid #fff;border-top:10px solid transparent;border-bottom:10px solid transparent}
  .item.playing .p{opacity:0}

  /* tombol suara & layar penuh, muncul saat video diputar */
  .ctl{position:absolute;top:8px;right:8px;z-index:2;display:flex;gap:6px;opacity:0;visibility:hidden;transition:opacity .2s}
  .item.playing .ctl{opacity:1;visibility:visible}
  .ctl button{width:34px;height:34px;border:0;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center;cursor:pointer}
  .ctl svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .grid .i-off{display:none}
  .grid.is-muted .i-on{display:none}
  .grid.is-muted .i-off{display:block}

  /* progres */
  .bar{position:absolute;left:0;right:0;bottom:0;height:3px;z-index:2;background:var(--brand);transform:scaleX(var(--pr,0));transform-origin:left;opacity:0;pointer-events:none}
  .item.playing .bar{opacity:1}

  /* video gagal dimuat */
  .err{position:absolute;inset:0;z-index:3;display:none;align-items:center;justify-content:center;text-align:center;padding:16px;font-size:13px;line-height:1.4;color:var(--muted);background:var(--card)}
  .item.bad .err{display:flex}

  /* halaman */
  nav{display:flex;justify-content:center;align-items:center;gap:6px;flex-wrap:wrap;margin-top:24px}
  nav button{min-width:40px;height:40px;padding:0 14px;border:0;border-radius:8px;background:var(--card);color:var(--fg);font:inherit;cursor:pointer}
  nav button[aria-current="page"]{background:var(--brand);color:var(--brand-fg);font-weight:700}
  nav button:disabled{opacity:.4;cursor:default}
  .status{text-align:center;color:var(--muted);font-size:13px;margin-top:12px}

  button:focus-visible,.hit:focus-visible,a:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
  .hit:focus-visible{outline-offset:-3px}
  .msg{text-align:center;color:var(--muted);padding:48px 0;line-height:1.5}

  [hidden]{display:none!important}

  /* tab Video / Foto */
  .tabs{display:flex;width:max-content;margin:0 auto 12px;padding:3px;gap:3px;background:var(--card);border-radius:10px}
  .tabs button{height:34px;min-width:84px;padding:0 16px;border:0;border-radius:8px;background:transparent;color:var(--muted);font:inherit;font-size:14px;cursor:pointer}
  .tabs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);font-weight:600}

  /* galeri foto: 2 kolom, tinggi mengikuti gambar */
  .gallery{column-count:2;column-gap:8px}
  .ph{position:relative;display:block;width:100%;margin:0 0 8px;padding:0;border:0;border-radius:8px;overflow:hidden;background:var(--card);cursor:pointer;break-inside:avoid;color:inherit;font:inherit}
  .ph img{display:block;width:100%;height:auto}
  .ph.loading{aspect-ratio:3/4}
  .ph .cap{position:absolute;left:0;right:0;bottom:0;padding:24px 8px 8px;color:#fff;font-size:13px;line-height:1.3;text-align:left;background:linear-gradient(transparent,rgba(0,0,0,.65));pointer-events:none}
  .ph.bad{aspect-ratio:3/4;display:flex;align-items:center;justify-content:center;cursor:default}
  .ph.bad img,.ph.bad .cap{display:none}
  .ph.bad::after{content:"Gambar tidak bisa dimuat. Cek link-nya di photos.txt.";padding:16px;text-align:center;font-size:13px;line-height:1.4;color:var(--muted)}

  /* viewer foto layar penuh */
  .lb{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;background:#000;color:#fff}
  .lb-top{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;font-size:14px}
  .lb-top .r{display:flex;align-items:center;gap:8px}
  .lb a{color:#fff;font-size:14px;padding:8px 12px;border-radius:8px;background:rgba(255,255,255,.14);text-decoration:none}
  .lb button{border:0;color:#fff;cursor:pointer}
  .lb-x{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center}
  .lb svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .lb-stage{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;touch-action:pan-y}
  .lb-stage img{max-width:100%;max-height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none}
  .lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center}
  .lb-nav.prev{left:8px}.lb-nav.next{right:8px}
  .lb-nav:disabled{opacity:.25;cursor:default}
  .lb-cap{padding:10px 16px calc(14px + env(safe-area-inset-bottom,0px));text-align:center;font-size:14px;line-height:1.4;min-height:20px}
  .lb button:focus-visible,.lb a:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

  /* slot iklan: kosong = tidak tampil sama sekali */
  .ad{display:flex;flex-direction:column;align-items:center;gap:4px;max-width:100%;margin:0 auto 14px;overflow:hidden}
  .ad:empty{display:none}
  .ad::before{content:"Iklan";font-size:11px;color:var(--muted)}
  #ad-bottom{margin:28px auto 0}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="in">
    <a class="brand" href="./" id="home" aria-label="BunnyVid, ke halaman pertama">
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
        <ellipse cx="11" cy="8" rx="3.2" ry="7" fill="currentColor"/>
        <ellipse cx="21" cy="8" rx="3.2" ry="7" fill="currentColor"/>
        <rect x="3" y="11" width="26" height="19" rx="9" fill="currentColor"/>
        <path d="M13.5 15.5v10l8-5z" fill="#fff"/>
      </svg>
      <span>BunnyVid</span>
    </a>
    <span class="count" id="count"></span>
  </div>
</header>
<main>
  <div class="tabs" role="group" aria-label="Jenis konten">
    <button type="button" data-tab="video" aria-pressed="true">Video</button>
    <button type="button" data-tab="foto" aria-pressed="false">Foto</button>
  </div>
  <!-- IKLAN ATAS: tempel kode banner dari ad network di antara tag div di bawah ini -->
  <div class="ad" id="ad-top">
    <script>
      atOptions = {
        'key' : '89538a995ffe3248a2a7e573f92a52a7',
        'format' : 'iframe',
        'height' : 50,
        'width' : 320,
        'params' : {}
      };
    </script>
    <script src="https://bicea.org/22/89538a995ffe3248a2a7e573f92a52a7"></script>
  </div>
  <div class="grid" id="grid"></div>
  <div class="gallery" id="gallery" hidden></div>
  <nav id="pager" aria-label="Halaman"></nav>
  <p class="status" id="status" aria-live="polite"></p>
  <!-- IKLAN BAWAH: tempel kode banner kedua di antara tag div di bawah ini (boleh dikosongkan) -->
  <div class="ad" id="ad-bottom">
    <script>
      atOptions = {
        'key' : 'cc1f5431a256a66c557fa0d4b7f8d7da',
        'format' : 'iframe',
        'height' : 250,
        'width' : 300,
        'params' : {}
      };
    </script>
    <script src="https://bicea.org/22/cc1f5431a256a66c557fa0d4b7f8d7da"></script>
  </div>
  <p class="msg" id="msg" hidden></p>
</main>
<!-- SCRIPT IKLAN GLOBAL: kode jenis Social Bar / Popunder / auto ads dari ad network ditempel di sini -->
<script data-cfasync="false" src="https://bicea.org/14/7d7ce0c11e75cc629252637236aabec0"></script>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Foto" hidden>
  <div class="lb-top">
    <span id="lbCount"></span>
    <div class="r">
      <a id="lbOpen" href="#" target="_blank" rel="noopener">Buka asli</a>
      <button type="button" class="lb-x" id="lbClose" aria-label="Tutup"><svg viewBox="0 0 24 24"><path d="M6 6l12 12"/><path d="M18 6 6 18"/></svg></button>
    </div>
  </div>
  <div class="lb-stage" id="lbStage">
    <button type="button" class="lb-nav prev" id="lbPrev" aria-label="Foto sebelumnya"><svg viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></svg></button>
    <img id="lbImg" alt="" draggable="false">
    <button type="button" class="lb-nav next" id="lbNext" aria-label="Foto berikutnya"><svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg></button>
  </div>
  <p class="lb-cap" id="lbCap"></p>
</div>
<script>
const PER = { video: 10, foto: 12 };   // jumlah per halaman
const LABEL = { video: 'video', foto: 'foto' };
const EMPTY = { video: 'Belum ada video. Tambahkan link di videos.txt.', foto: 'Belum ada foto. Tambahkan link gambar di photos.txt.' };
const LOAD_ERR = 'Gagal memuat daftar. Buka lewat GitHub Pages atau server lokal, bukan file://.';
const lists = { video: [], foto: [] };
const loadError = { video: false, foto: false };
let tab = 'video';
const gallery = document.getElementById('gallery');
const tabBtns = [...document.querySelectorAll('.tabs button')];
const lb = document.getElementById('lb'), lbImg = document.getElementById('lbImg'), lbCap = document.getElementById('lbCap');
const lbCount = document.getElementById('lbCount'), lbOpen = document.getElementById('lbOpen');
const lbPrev = document.getElementById('lbPrev'), lbNext = document.getElementById('lbNext'), lbClose = document.getElementById('lbClose');
const lbStage = document.getElementById('lbStage');
const grid = document.getElementById('grid');
const pager = document.getElementById('pager');
const msg = document.getElementById('msg');
const statusEl = document.getElementById('status');
const countEl = document.getElementById('count');
let current = null;
let muted = false;

const ICON_SOUND = '<svg class="i-on" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>'
                 + '<svg class="i-off" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="m16 9 5 6"/><path d="m21 9-5 6"/></svg>';
const ICON_FULL = '<svg viewBox="0 0 24 24"><path d="M4 9V4h5"/><path d="M20 9V4h-5"/><path d="M4 15v5h5"/><path d="M20 15v5h-5"/></svg>';

// iOS tidak menampilkan frame awal kecuali ada #t=
const withFrame = u => u.includes('#') ? u : u + '#t=0.1';

function loadSrc(v) {
  if (!v.getAttribute('src')) { v.src = withFrame(v.dataset.src); v.load(); }
}

// lazy load: video baru dimuat saat mendekati layar
const io = new IntersectionObserver(entries => {
  entries.forEach(e => { if (e.isIntersecting) loadSrc(e.target); });
}, { rootMargin: '300px' });

// video yang sedang diputar otomatis berhenti kalau keluar layar
const ioPlay = new IntersectionObserver(entries => {
  entries.forEach(e => { if (!e.isIntersecting && e.target === current) stopCurrent(); });
}, { threshold: 0.2 });

function readTab() { return new URLSearchParams(location.search).get('tab') === 'foto' ? 'foto' : 'video'; }
function buildUrl(t, p) {
  const q = new URLSearchParams();
  if (t !== 'video') q.set('tab', t);
  if (p > 1) q.set('page', p);
  const str = q.toString();
  return str ? '?' + str : location.pathname;
}
function totalPages() { return Math.max(1, Math.ceil(lists[tab].length / PER[tab])); }
function getPage() {
  const p = parseInt(new URLSearchParams(location.search).get('page'), 10);
  return Math.min(Math.max(p || 1, 1), totalPages());
}

function stopCurrent() {
  if (current) { current.pause(); current.parentElement.classList.remove('playing'); current = null; }
}

function buildItem(item) {
  const el = document.createElement('div');
  el.className = 'item';

  const v = document.createElement('video');
  v.dataset.src = item.url;
  v.preload = 'metadata';
  v.loop = true;
  v.muted = muted;
  v.playsInline = true;
  v.setAttribute('playsinline', '');
  if (item.thumbnail) v.poster = item.thumbnail;

  const hit = document.createElement('button');
  hit.type = 'button';
  hit.className = 'hit';
  hit.setAttribute('aria-label', 'Putar ' + (item.title || 'video'));

  const t = document.createElement('div'); t.className = 't'; t.textContent = item.title || '';
  const p = document.createElement('div'); p.className = 'p';
  const bar = document.createElement('div'); bar.className = 'bar';
  const err = document.createElement('div'); err.className = 'err';
  err.textContent = 'Video tidak bisa dimuat. Cek link-nya di videos.txt.';

  const ctl = document.createElement('div'); ctl.className = 'ctl';
  const bMute = document.createElement('button');
  bMute.type = 'button'; bMute.setAttribute('aria-label', 'Suara hidup atau mati'); bMute.innerHTML = ICON_SOUND;
  const bFull = document.createElement('button');
  bFull.type = 'button'; bFull.setAttribute('aria-label', 'Layar penuh'); bFull.innerHTML = ICON_FULL;
  ctl.append(bMute, bFull);

  el.append(v, t, p, bar, err, hit, ctl);

  const toggle = () => {
    if (el.classList.contains('bad')) return;
    if (current === v) { stopCurrent(); return; }
    stopCurrent();
    loadSrc(v);
    v.muted = muted;
    v.play().then(() => { current = v; el.classList.add('playing'); }).catch(() => {});
  };
  hit.addEventListener('click', toggle);

  bMute.addEventListener('click', () => {
    muted = !muted;
    grid.classList.toggle('is-muted', muted);
    grid.querySelectorAll('video').forEach(x => { x.muted = muted; });
  });
  bFull.addEventListener('click', () => {
    if (v.requestFullscreen) v.requestFullscreen().catch(() => {});
    else if (v.webkitEnterFullscreen) v.webkitEnterFullscreen();
  });

  v.addEventListener('timeupdate', () => {
    if (v.duration) el.style.setProperty('--pr', v.currentTime / v.duration);
  });
  v.addEventListener('error', () => {
    if (v.getAttribute('src')) { el.classList.add('bad'); el.classList.remove('playing'); if (current === v) current = null; }
  });
  v.addEventListener('fullscreenchange', () => { v.controls = document.fullscreenElement === v; });

  return { el, v };
}

function render() {
  stopCurrent();
  closeLightbox(false);
  io.disconnect(); ioPlay.disconnect();
  tab = readTab();
  tabBtns.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.tab === tab)));
  const list = lists[tab];
  countEl.textContent = list.length + ' ' + LABEL[tab];
  grid.hidden = tab !== 'video';
  gallery.hidden = tab !== 'foto';
  grid.innerHTML = ''; gallery.innerHTML = ''; pager.innerHTML = ''; statusEl.textContent = '';
  msg.hidden = true;
  if (!list.length) {
    msg.hidden = false;
    msg.textContent = loadError[tab] ? LOAD_ERR : EMPTY[tab];
    document.title = tab === 'foto' ? 'BunnyVid, foto' : 'BunnyVid';
    window.scrollTo(0, 0);
    return;
  }
  const page = getPage(), total = totalPages();
  const from = (page - 1) * PER[tab];
  const slice = list.slice(from, from + PER[tab]);
  if (tab === 'video') {
    slice.forEach(item => {
      const { el, v } = buildItem(item);
      grid.appendChild(el);
      io.observe(v);
      ioPlay.observe(v);
    });
    grid.classList.toggle('is-muted', muted);
  } else {
    slice.forEach((item, i) => gallery.appendChild(buildPhoto(item, from + i)));
  }
  document.title = 'BunnyVid' + (tab === 'foto' ? ', foto' : '') + (page > 1 ? ', halaman ' + page : '');
  statusEl.textContent = total > 1 ? 'Halaman ' + page + ' dari ' + total : '';
  renderPager(page, total);
  window.scrollTo(0, 0);
}

function buildPhoto(item, index) {
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'ph loading';
  b.setAttribute('aria-label', 'Buka foto' + (item.title ? ': ' + item.title : ''));
  const img = new Image();
  img.loading = 'lazy';
  img.decoding = 'async';
  img.alt = item.title || '';
  img.addEventListener('load', () => b.classList.remove('loading'));
  img.addEventListener('error', () => { b.classList.remove('loading'); b.classList.add('bad'); b.disabled = true; });
  img.src = item.url;
  b.append(img);
  if (item.title) { const c = document.createElement('div'); c.className = 'cap'; c.textContent = item.title; b.append(c); }
  b.addEventListener('click', () => openLightbox(index, b));
  return b;
}

// ---------- viewer foto ----------
let lbIndex = -1, lbOpener = null;
function showLb(i) {
  const list = lists.foto;
  lbIndex = Math.min(Math.max(i, 0), list.length - 1);
  const it = list[lbIndex];
  lbImg.src = it.url;
  lbImg.alt = it.title || '';
  lbCap.textContent = it.title || '';
  lbOpen.href = it.url;
  lbCount.textContent = (lbIndex + 1) + ' / ' + list.length;
  lbPrev.disabled = lbIndex === 0;
  lbNext.disabled = lbIndex === list.length - 1;
  [lbIndex - 1, lbIndex + 1].forEach(j => { if (list[j]) new Image().src = list[j].url; }); // preload tetangga
}
function openLightbox(i, opener) {
  lbOpener = opener;
  lb.hidden = false;
  document.body.style.overflow = 'hidden';
  showLb(i);
  lbClose.focus();
}
function closeLightbox(sync = true) {
  if (lb.hidden) return;
  lb.hidden = true;
  lbImg.removeAttribute('src');
  document.body.style.overflow = '';
  const idx = lbIndex;
  const opener = lbOpener;
  lbOpener = null;
  // kalau geser ke foto di halaman lain, ikut pindah ke halamannya
  if (sync && idx >= 0) {
    const p = Math.floor(idx / PER.foto) + 1;
    if (p !== getPage()) { go(p); return; }
  }
  if (opener && document.contains(opener)) opener.focus({ preventScroll: true });
}
lbClose.addEventListener('click', () => closeLightbox());
lbPrev.addEventListener('click', () => showLb(lbIndex - 1));
lbNext.addEventListener('click', () => showLb(lbIndex + 1));
lbStage.addEventListener('click', e => { if (e.target === lbStage) closeLightbox(); });
let tx = 0, ty = 0;
lbStage.addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
lbStage.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) showLb(lbIndex + (dx < 0 ? 1 : -1));
}, { passive: true });

function renderPager(page, total) {
  pager.innerHTML = '';
  if (total <= 1) return;
  const btn = (label, p, opts = {}) => {
    const b = document.createElement('button');
    b.textContent = label;
    if (opts.disabled) b.disabled = true;
    if (opts.current) b.setAttribute('aria-current', 'page');
    b.addEventListener('click', () => go(p));
    pager.appendChild(b);
  };
  btn('Sebelumnya', page - 1, { disabled: page === 1 });
  // tampilkan maksimal 5 nomor di sekitar halaman aktif
  let start = Math.max(1, page - 2), end = Math.min(total, start + 4);
  start = Math.max(1, end - 4);
  for (let i = start; i <= end; i++) btn(String(i), i, { current: i === page });
  btn('Berikutnya', page + 1, { disabled: page === total });
}

function go(p, t = tab) {
  history.pushState(null, '', buildUrl(t, p));
  render();
}
tabBtns.forEach(b => b.addEventListener('click', () => { if (b.dataset.tab !== tab) go(1, b.dataset.tab); }));
window.addEventListener('popstate', render);

// logo/judul: balik ke halaman 1 tanpa reload
document.getElementById('home').addEventListener('click', e => {
  if (e.metaKey || e.ctrlKey || e.shiftKey) return;
  e.preventDefault();
  if (location.search) go(1, 'video'); else window.scrollTo({ top: 0, behavior: 'smooth' });
});

// keyboard: di viewer foto panah = foto sebelumnya/berikutnya, selain itu panah = ganti halaman
document.addEventListener('keydown', e => {
  if (!lb.hidden) {
    if (e.key === 'Escape') closeLightbox();
    else if (e.key === 'ArrowLeft') showLb(lbIndex - 1);
    else if (e.key === 'ArrowRight') showLb(lbIndex + 1);
    else if (e.key === 'Tab') { // fokus tetap di dalam viewer
      const f = [...lb.querySelectorAll('button:not(:disabled),a[href]')];
      const i = f.indexOf(document.activeElement);
      if (e.shiftKey && i <= 0) { e.preventDefault(); f[f.length - 1].focus(); }
      else if (!e.shiftKey && i === f.length - 1) { e.preventDefault(); f[0].focus(); }
    }
    return;
  }
  if (e.altKey || e.ctrlKey || e.metaKey || document.fullscreenElement) return;
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  const page = getPage(), total = totalPages();
  if (e.key === 'ArrowRight' && page < total) go(page + 1);
  if (e.key === 'ArrowLeft' && page > 1) go(page - 1);
});

// pause saat pindah tab
document.addEventListener('visibilitychange', () => { if (document.hidden) stopCurrent(); });

// Baca videos.txt: satu baris = satu link. Boleh "Judul | link". Baris berawalan # diabaikan.
// Baris paling bawah = video terbaru = tampil paling atas.
function parseTxt(text) {
  return text.split(/\r?\n/).map(l => l.trim()).filter(l => l && !l.startsWith('#')).map(l => {
    const k = l.indexOf('|');
    if (k > -1 && !/^https?:/i.test(l.slice(0, k).trim())) {
      return { title: l.slice(0, k).trim(), url: l.slice(k + 1).trim() };
    }
    return { url: l };
  }).filter(v => /^https?:\/\//i.test(v.url) || /^[\w.\-\/%]+\.(jpe?g|png|gif|webp|avif|mp4|webm|mov)(\?.*)?$/i.test(v.url)); // link penuh, atau path file di repo
}

// link ganda dibuang, yang dipakai kemunculan paling bawah
function dedupe(list) {
  const m = new Map();
  list.forEach(v => { m.delete(v.url); m.set(v.url, v); });
  return [...m.values()];
}

async function loadVideos() {
  try {
    const r = await fetch('videos.txt', { cache: 'no-cache' });
    if (r.ok) return parseTxt(await r.text());
  } catch (e) {}
  // cadangan: videos.json lama
  const r = await fetch('videos.json', { cache: 'no-cache' });
  if (!r.ok) throw new Error(r.status);
  const d = await r.json();
  return Array.isArray(d) ? d : (d.videos || []);
}

// photos.txt formatnya sama dengan videos.txt. Kalau belum ada, galeri kosong (bukan error).
async function loadPhotos() {
  try {
    const r = await fetch('photos.txt', { cache: 'no-cache' });
    if (r.ok) return parseTxt(await r.text());
  } catch (e) {}
  return [];
}

Promise.all([
  loadVideos().catch(() => { loadError.video = true; return []; }),
  loadPhotos()
]).then(([v, f]) => {
  lists.video = dedupe(v).reverse(); // terbaru (paling bawah di file) jadi paling atas
  lists.foto = dedupe(f).reverse();
  render();
});
</script>
</body>
