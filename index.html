<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BunnyVid</title>
<meta name="description" content="BunnyVid, tempat nonton video.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="top">
  <div class="brand"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><ellipse cx="8.5" cy="7" rx="3" ry="6"/><ellipse cx="15.5" cy="7" rx="3" ry="6"/><circle cx="12" cy="16" r="6"/></svg><span id="brandName">BunnyVid</span></div>
  <input class="search" id="q" type="search" placeholder="Cari video" aria-label="Cari video">
  <button class="btn" id="theme" aria-label="Ganti tema terang atau gelap">Tema</button>
</header>
<main class="wrap">
  <div class="slot" id="slot" hidden></div>
  <div class="head"><h3>Video terbaru</h3><span id="gc"></span></div>
  <div class="grid" id="grid"></div>
  <div class="more"><button class="btn" id="more" hidden>Tampilkan lebih banyak</button></div>
</main>

<div class="veil vm" id="vm" role="dialog" aria-modal="true" aria-labelledby="vmT">
  <div class="modal">
    <div class="screen" id="screen"></div>
    <div class="mbar">
      <h2 id="vmT"></h2>
      <a id="vmMega" target="_blank" rel="noopener">Buka di Mega</a>
      <button class="btn" id="vmClose">Tutup</button>
    </div>
    <h3 class="relh">Video terkait</h3>
    <div class="rel" id="rel"></div>
  </div>
</div>

<div class="veil ad-veil" id="adv" role="dialog" aria-modal="true" aria-labelledby="adT">
  <div class="ad">
    <h2 id="adT"></h2>
    <p id="adP"></p>
    <div class="row">
      <a class="btn pri" id="adA" target="_blank" rel="noopener"></a>
      <button class="btn" id="adClose" disabled>Tutup dalam 5</button>
    </div>
  </div>
</div>
<script src="js/app.js"></script>
</body>
</html>
